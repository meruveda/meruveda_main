<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>MeruVeda Wellness</title>
  <desc>Logo mark: a mountain range with a lotus flower at its base, above the wordmark "MeruVeda Wellness" in gold.</desc>
  <defs>
    <linearGradient id="goldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1D488"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8901F"/>
    </linearGradient>
  </defs>

  <!-- flanking accent lines -->
  <line x1="40" y1="176" x2="118" y2="176" stroke="url(#goldFill)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="184" x2="106" y2="184" stroke="url(#goldFill)" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="682" y1="176" x2="760" y2="176" stroke="url(#goldFill)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="694" y1="184" x2="760" y2="184" stroke="url(#goldFill)" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

  <!-- mountain range -->
  <path d="M124,180 L218,102 L276,148 L400,48 L524,148 L582,102 L676,180"
        fill="none" stroke="url(#goldFill)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M400,48 L370,96 L400,116 L430,96 Z" fill="url(#goldFill)" opacity="0.35"/>

  <!-- lotus -->
  <g transform="translate(400,180)">
    <path d="M0,-6 C-10,-30 -30,-34 -34,-14 C-22,-16 -10,-12 0,-6 Z" fill="url(#goldFill)"/>
    <path d="M0,-6 C10,-30 30,-34 34,-14 C22,-16 10,-12 0,-6 Z" fill="url(#goldFill)"/>
    <path d="M0,-6 C-6,-26 -4,-40 0,-46 C4,-40 6,-26 0,-6 Z" fill="url(#goldFill)"/>
    <path d="M0,-6 C-16,-14 -26,-10 -22,4 C-14,-2 -6,-6 0,-6 Z" fill="url(#goldFill)" opacity="0.85"/>
    <path d="M0,-6 C16,-14 26,-10 22,4 C14,-2 6,-6 0,-6 Z" fill="url(#goldFill)" opacity="0.85"/>
    <line x1="-34" y1="4" x2="34" y2="4" stroke="url(#goldFill)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="400" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="70" font-weight="700" letter-spacing="2" fill="url(#goldFill)">MERUVEDA</text>
  <text x="400" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="32" letter-spacing="8" fill="#D4AF37">WELLNESS</text>
</svg>

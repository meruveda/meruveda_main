name: CI

on:
  push:
    branches: [main, master, 'hardening-*']
  pull_request:
  workflow_dispatch:

# A new push makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level so the step `if:` below can see it (a step cannot read its own
    # env). Empty when the repository has no DATABASE_URL secret -> schema
    # verification skips instead of failing forks/PRs.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- typecheck ---------------------------------------------------------
      - name: Typecheck shared
        run: npm run build -w @meruveda/shared

      - name: Typecheck backend
        run: npx tsc --noEmit -p backend/tsconfig.json

      - name: Typecheck frontend
        run: npx tsc --noEmit -p frontend/tsconfig.json

      - name: Typecheck admin
        run: npm run type-check -w meruveda-admin

      # --- lint --------------------------------------------------------------
      # backend and shared have no ESLint setup yet, so they are skipped by
      # --if-present rather than silently passing off a missing config.
      - name: Lint (frontend, admin)
        run: npm run lint --workspaces --if-present

      # --- test --------------------------------------------------------------
      - name: Test backend
        run: npm test -w backend

      - name: Test frontend
        run: npm test -w meruveda

      # --- build (what Vercel actually runs) ---------------------------------
      - name: Build backend (tsc + runtime assets)
        run: npm run build -w backend

      # next.config throws in a production build when no backend origin is
      # configured; CI has no .env, so give it a harmless placeholder (the
      # Vercel platform rewrite owns /api in the real deployment).
      - name: Build frontend (Next.js)
        run: npm run build -w meruveda
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api

      - name: Build admin
        run: npm run build -w meruveda-admin

      # --- pre-deploy environment gate ----------------------------------------
      # Every variable the app needs must be documented in the template, and
      # no retired variable may still be listed. This is the check that stops
      # a missing credential from reaching a deployment.
      - name: Check the environment template
        run: |
          node backend/scripts/check-env-names.js
          npm run env:parity -w backend -- --vercel || true

      # --- schema drift -------------------------------------------------------
      # Read-only comparison of the live Neon schema against
      # backend/database/neon/expected-schema.json. Skipped when the repository
      # has no DATABASE_URL secret (forks, PRs from outside).
      - name: Verify Neon schema
        if: ${{ env.DATABASE_URL != '' }}
        run: node backend/scripts/db-verify.js